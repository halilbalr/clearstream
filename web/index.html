<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: https: data:; media-src 'self' https: http: blob:; connect-src https: http:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0e1014">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Clearstream: legitimate free TV channels, plus your own paid service, on your phone, computer and LG TV.">
  <title>Clearstream</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="app.css">
</head>
<body>

      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

      <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 6.3v11.4a.9.9 0 0 0 1.4.8l7.7-5.5a1.2 1.2 0 0 0 0-2L7.9 5.5a.9.9 0 0 0-1.4.8z"/><rect x="15.9" y="5.5" width="2.6" height="13" rx=".8"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>

      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.2L2.8 17.5A2 2 0 0 0 4.5 20.5h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.2v.1"/></symbol>

  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span class="brand-name">Clearstream</span>
      </div>
      <div class="search" role="search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search" xlink:href="#i-search"></use></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
               data-i18n-placeholder="app.search" data-i18n-label="app.search">
        <button id="search-clear" class="icon-btn search-clear" type="button" data-i18n-label="app.clearSearch" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-close" xlink:href="#i-close"></use></svg>
        </button>
      </div>
      <button id="btn-settings" class="icon-btn" type="button" data-i18n-label="app.settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings" xlink:href="#i-settings"></use></svg>
      </button>
      <div id="progress" class="progress" hidden><div id="progress-fill" class="progress-fill"></div></div>
    </header>

    <div class="main">
      <nav id="groups" class="groups" data-i18n-label="app.groups"></nav>

      <section class="list-pane" aria-labelledby="list-title">
        <div class="list-head">
          <div class="list-titles">
            <h1 id="list-title" class="list-title"></h1>
            <span id="list-count" class="list-count"></span>
          </div>
          <div class="list-tools">
            <select id="country" class="input input-small" data-i18n-label="list.allCountries" hidden></select>
            <button id="btn-check" class="btn btn-small btn-ghost" type="button" data-i18n-label="app.checkLabel">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh" xlink:href="#i-refresh"></use></svg>
              <span class="btn-check-label" data-i18n="app.check"></span>
            </button>
          </div>
        </div>
        <div id="list-scroll" class="list-scroll">
          <ul id="channel-list" class="channel-list"></ul>
          <div id="empty" class="empty" hidden></div>
        </div>
      </section>

      <section class="player-pane">
        <div id="stage" class="stage">
          <div id="screen" class="screen is-idle">
            <video id="video" playsinline webkit-playsinline preload="none"></video>
            <div id="idle" class="idle"></div>
            <div id="spinner" class="spinner" hidden></div>
            <button id="tap-play" class="tap-play" type="button" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-play" xlink:href="#i-play"></use></svg>
              <span data-i18n="ctl.tap"></span>
            </button>
            <div id="osd" class="osd">
              <div id="osd-name" class="osd-name"></div>
              <div id="osd-status" class="osd-status"></div>
              <div class="osd-hint" data-i18n="osd.hint"></div>
            </div>
          </div>
          <div id="bar" class="bar is-empty">
            <div class="np">
              <span id="np-logo" class="np-logo"></span>
              <div class="np-text">
                <div id="np-name" class="np-name"></div>
                <div id="np-status" class="np-status"></div>
              </div>
            </div>
            <div class="ctrls">
              <button id="b-prev" class="icon-btn" type="button" data-i18n-label="ctl.prev">
                <svg class="icon" aria-hidden="true"><use href="#i-prev" xlink:href="#i-prev"></use></svg>
              </button>
              <button id="b-play" class="icon-btn icon-btn-main" type="button" data-i18n-label="ctl.play">
                <svg class="icon" aria-hidden="true"><use href="#i-play" xlink:href="#i-play"></use></svg>
              </button>
              <button id="b-next" class="icon-btn" type="button" data-i18n-label="ctl.next">
                <svg class="icon" aria-hidden="true"><use href="#i-next" xlink:href="#i-next"></use></svg>
              </button>
              <span class="ctrls-gap"></span>
              <button id="b-fav" class="icon-btn" type="button" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-star" xlink:href="#i-star"></use></svg>
              </button>
              <button id="b-fit" class="icon-btn" type="button" data-i18n-label="ctl.fit">
                <svg class="icon" aria-hidden="true"><use href="#i-fit" xlink:href="#i-fit"></use></svg>
              </button>
              <button id="b-quality" class="icon-btn" type="button" data-i18n-label="ctl.quality" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-quality" xlink:href="#i-quality"></use></svg>
              </button>
              <span class="volume">
                <button id="b-mute" class="icon-btn" type="button" data-i18n-label="ctl.mute">
                  <svg class="icon" aria-hidden="true"><use href="#i-volume" xlink:href="#i-volume"></use></svg>
                </button>
                <input id="vol" class="vol" type="range" min="0" max="1" step="0.05" data-i18n-label="ctl.volume">
              </span>
              <button id="b-full" class="icon-btn" type="button" data-i18n-label="ctl.full">
                <svg class="icon" aria-hidden="true"><use href="#i-full" xlink:href="#i-full"></use></svg>
              </button>
              <button id="b-stop" class="icon-btn" type="button" data-i18n-label="ctl.stop">
                <svg class="icon" aria-hidden="true"><use href="#i-stop" xlink:href="#i-stop"></use></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="info" class="info">
          <h2 id="info-title"></h2>
          <dl id="info-facts" class="facts" hidden></dl>
          <p class="info-note" data-i18n="about.free"></p>
          <p id="info-keys" class="info-keys"></p>
        </div>
      </section>
    </div>

    <footer class="statusbar"><span id="status-text" role="status" aria-live="polite"></span></footer>
  </div>

  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/hls.js/hls.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/health.js"></script>
  <script src="js/player.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
